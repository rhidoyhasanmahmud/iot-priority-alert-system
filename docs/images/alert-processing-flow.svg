<text x="590.0" y="813.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Select next alert</text>
<text x="590.0" y="845.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">FIFO / priority / fixed aging / EDF</text>
<text x="590.0" y="873.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Adaptive and matched variants share selector</text>
<polyline points="590,895 590,950" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,950 584.7804135906653,939.1946347717678 595.2195864093347,939.1946347717678" fill="#718096"/>
<rect x="310" y="950" width="560" height="100" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="988.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Process one alert</text>
<text x="590.0" y="1020.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Configured synthetic service; no preemption</text>
