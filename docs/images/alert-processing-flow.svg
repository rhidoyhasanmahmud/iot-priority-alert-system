<text x="1025.0" y="478.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087F8C" text-anchor="middle">Record receipt</text>
<text x="1025.0" y="510.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Invalid / full / conflict</text>
<text x="1025.0" y="538.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Duplicate suppressed</text>
<polyline points="590,390 590,445" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,445 584.7804135906653,434.1946347717679 595.2195864093347,434.1946347717679" fill="#718096"/>
<rect x="310" y="445" width="560" height="105" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="483.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Check source + event ID</text>
<text x="590.0" y="515.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Pinned pending IDs + bounded completion TTL</text>
<polyline points="870,497 895,497" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="895,497 884.1946347717678,502.21958640933474 884.1946347717678,491.78041359066526" fill="#718096"/>
