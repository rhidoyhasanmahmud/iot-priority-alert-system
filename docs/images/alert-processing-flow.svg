<text x="590.0" y="1143.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Record completion</text>
<text x="590.0" y="1175.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Waiting, service, latency and deadline status</text>
<polyline points="310,1155 180,1155 180,835 310,835" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="310,835 299.1946347717679,840.2195864093347 299.1946347717679,829.7804135906653" fill="#718096"/>
<text x="65" y="985.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Next alert</text>
<text x="65" y="1014.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Wait if empty</text>
<rect x="60" y="1280" width="1080" height="105" rx="14" fill="#ECFDF5" stroke="#087F8C" stroke-width="2"/>
<text x="600.0" y="1318.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087F8C" text-anchor="middle">Output and shutdown</text>
<text x="600.0" y="1350.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">JSON receipts + CSV completions; completed ID cache uses TTL</text>
<text x="600.0" y="1378.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Disconnect intake, drain admitted alerts; cache resets on restart</text>
<text x="60" y="1435.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Real callback / worker interleaving differs from simulated arrival batches.</text>
