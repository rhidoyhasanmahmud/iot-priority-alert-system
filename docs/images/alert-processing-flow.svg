<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="65.6" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#172B4D" text-anchor="start">Alert processing flow</text>
<text x="60" y="108.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#526580" text-anchor="start">Current live MQTT demo; non-preemptive processing</text>
<rect x="310" y="150" width="560" height="100" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="188.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Receive message</text>
<text x="590.0" y="220.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Callback receives payload from lab/alerts</text>
<polyline points="590,250 590,285" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,285 584.7804135906653,274.1946347717679 595.2195864093347,274.1946347717679" fill="#718096"/>
<rect x="310" y="285" width="560" height="105" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="323.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Validate payload</text>
<text x="590.0" y="355.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">String event ID and priority 0, 1 or 2</text>
<polyline points="870,337 1010,337 1010,440" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="1010,440 1004.7804135906653,429.1946347717679 1015.2195864093347,429.1946347717679" fill="#718096"/>
<text x="940" y="315.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Invalid</text>
<rect x="895" y="440" width="260" height="120" rx="14" fill="#ECFDF5" stroke="#718096" stroke-width="2"/>
<text x="1025.0" y="478.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#718096" text-anchor="middle">Reject and log</text>
<text x="1025.0" y="510.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Invalid payload</text>
<text x="1025.0" y="538.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">or full queue</text>
<polyline points="590,390 590,445" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,445 584.7804135906653,434.1946347717679 595.2195864093347,434.1946347717679" fill="#718096"/>
<text x="610" y="421.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Valid</text>
<rect x="310" y="445" width="560" height="105" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="483.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Attempt queue admission</text>
<text x="590.0" y="515.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Bounded queue: 10,000 waiting events</text>
<polyline points="870,497 895,497" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="895,497 884.1946347717678,502.21958640933474 884.1946347717678,491.78041359066526" fill="#718096"/>
<text x="883" y="590.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Full</text>
<polyline points="590,550 590,610" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,610 584.7804135906653,599.1946347717678 595.2195864093347,599.1946347717678" fill="#718096"/>
<text x="610" y="583.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Admitted</text>
<rect x="310" y="610" width="560" height="120" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="648.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Select next waiting alert</text>
<text x="590.0" y="680.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">FIFO: receiver arrival order</text>
<text x="590.0" y="708.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Priority: highest urgency; arrival breaks ties</text>
<polyline points="590,730 590,785" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,785 584.7804135906653,774.1946347717678 595.2195864093347,774.1946347717678" fill="#718096"/>
<rect x="310" y="785" width="560" height="100" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="823.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Process one alert</text>
<text x="590.0" y="855.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">20 ms synthetic service; no preemption</text>
<polyline points="590,885 590,940" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="590,940 584.7804135906653,929.1946347717678 595.2195864093347,929.1946347717678" fill="#718096"/>
<rect x="310" y="940" width="560" height="100" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="978.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Emit result</text>
<text x="590.0" y="1010.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">JSON event and receiver-local latency</text>
<polyline points="310,990 180,990 180,670 310,670" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="310,670 299.1946347717679,675.2195864093347 299.1946347717679,664.7804135906653" fill="#718096"/>
<text x="65" y="820.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Next alert</text>
<text x="65" y="849.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Wait if empty</text>
<rect x="60" y="1110" width="1080" height="105" rx="14" fill="#F1F5F9" stroke="#718096" stroke-width="2" stroke-dasharray="8 5"/>
<text x="600.0" y="1148.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#718096" text-anchor="middle">Planned research flow additions</text>
<text x="600.0" y="1180.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Deduplication, trusted deadline metadata and complete admission metrics</text>
<text x="60" y="1255.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">Fixed aging runs in the separate simulation pilot; it is not part of this live demo.</text>
</svg>
