<text x="610" y="583.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="start">New identity</text>
<rect x="310" y="610" width="560" height="105" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="590.0" y="648.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">Attempt queue admission</text>
<text x="590.0" y="680.3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#526580" text-anchor="middle">Waiting slots exclude the active worker</text>
<polyline points="870,662 1025,662 1025,560" fill="none" stroke="#718096" stroke-width="3"/>
<polygon points="1025,560 1030.2195864093349,570.8053652282322 1019.7804135906653,570.8053652282322" fill="#718096"/>
