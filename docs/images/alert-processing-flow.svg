<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 60 1200 1460">
<rect x="0" y="60" width="1200" height="1460" fill="white"/>
<text x="60" y="108.7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#526580" text-anchor="start">Live MQTT path; one non-preemptive worker</text>
