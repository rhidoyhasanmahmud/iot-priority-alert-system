name: Stage 5G reference-handler contract smoke

on:
  pull_request:
    paths:
      - .github/workflows/stage5g-service-contract.yml
      - literature/validation/stage5g_**
      - literature/validation/fixtures/stage5g_**
      - literature/synthesis/application-handler-calibration-stage5g.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-sqlite-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check independent handler and audit contracts
        run: |
          python -m py_compile literature/validation/stage5g_reference_handler.py literature/validation/stage5g_service_audit.py
          python literature/validation/stage5g_reference_handler.py --self-test
          python literature/validation/stage5g_service_audit.py --self-test

      - name: Generate and independently audit two new ephemeral lab traces
        run: |
          mkdir -p stage5g-ci-output
          python literature/validation/stage5g_reference_handler.py \
            --events 32 --seeds 11 22 --output-dir stage5g-ci-output
          python literature/validation/stage5g_service_audit.py stage5g-ci-output/*.jsonl

      - name: Re-audit committed synthetic traces
        run: |
          python literature/validation/stage5g_service_audit.py \
            literature/validation/fixtures/stage5g_sqlite_seed101.jsonl \
            literature/validation/fixtures/stage5g_sqlite_seed202.jsonl \
            literature/validation/fixtures/stage5g_sqlite_seed303.jsonl
