name: Stage 5J controlled synthetic MQTT SQLite pilot

on:
  pull_request:
    paths:
      - .github/workflows/stage5j-controlled-testbed.yml
      - literature/validation/stage5j_**
      - literature/synthesis/controlled-testbed-stage5j.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-synthetic-mqtt-broker-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install loopback Mosquitto and Eclipse Paho 2.x
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto
          python -m pip install 'paho-mqtt>=2,<3'
          python -c 'import importlib.metadata as m; print(m.version("paho-mqtt"))'
          dpkg-query -W mosquitto

      - name: Start local MQTT broker with raw server log
        run: |
          mkdir -p stage5j-artifacts
          sudo systemctl stop mosquitto || true
          mosquitto -p 1883 -v > stage5j-artifacts/mosquitto.log 2>&1 &
          python - <<'PY'
          import socket, time
          for _ in range(50):
              try:
                  with socket.create_connection(('127.0.0.1', 1883), timeout=.2):
                      break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('Mosquitto not ready')
          print('PASS loopback broker TCP, actual Paho MQTT tested downstream')
          PY

      - name: Compile and run in-process positive and negative invariants
        run: |
          python -m py_compile literature/validation/stage5j_controlled_pilot.py \
            literature/validation/stage5j_batch_audit.py
          python literature/validation/stage5h_joint_audit.py --self-test
          python literature/validation/stage5j_controlled_pilot.py --self-test
          python literature/validation/stage5j_batch_audit.py --self-test

      - name: Run three seeds times two capacities times three broker-backed source shapes
        run: |
          python literature/validation/stage5j_controlled_pilot.py \
            --transport mqtt --seeds 101 202 303 --events 60 --queue-capacities 0 3 \
            --shuffle-seed 20261116 --timeout-s 25 \
            --output-dir stage5j-artifacts/paired
          python literature/validation/stage5j_batch_audit.py \
            stage5j-artifacts/paired/batch.json \
            | tee stage5j-artifacts/paired_batch_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage5j-artifacts/paired_batch_audit.json')
          summary = json.loads(p.read_text())
          assert summary['technical_audit'] == 'PASS'
          assert summary['runs_audited'] == 18
          assert summary['total_synthetic_offers'] == 1080
          assert summary['matched_base_burst_horizon_per_seed'] is True
          assert summary['field_calibration'] == 'NOT_AVAILABLE'
          assert summary['novel_policy_evaluation'] == 'NOT_PERFORMED'
          print('PASS 18/18 synthetic MQTT + SQLite replays, no empirical-policy acceptance threshold')
          PY

      - name: Upload diagnostics with no real-data claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5j-paired-controlled-mqtt-lab
          path: stage5j-artifacts/
          if-no-files-found: warn
          retention-days: 14
