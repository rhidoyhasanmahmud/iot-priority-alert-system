name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q iot_alerts
      - run: python -m iot_alerts.experiment --count 100 --output results/smoke
      - run: python -m iot_alerts.foundation --policy all --count 100 --queue-capacity 5 --deadlines-ms 100 500 2000 --output results/foundation-smoke
      - run: python -m iot_alerts.pilot --output results/pilot-regression
      - run: cmp evidence/pilot/run_metrics.csv results/pilot-regression/run_metrics.csv
      - run: python -m iot_alerts.foundation --policy all --count 100 --traffic burst --service-distribution uniform --queue-capacity 5 --deadlines-ms 100 500 2000 --output results/workload-smoke
      - run: python -m iot_alerts.foundation --policy all --trace-input results/workload-smoke/workload.csv --queue-capacity 5 --output results/replay-smoke
      - run: cmp results/workload-smoke/summary.json results/replay-smoke/summary.json
      - run: python -m iot_alerts.foundation --policy research --count 200 --queue-capacity 10 --deadlines-ms 100 500 2000 --traffic burst --service-distribution uniform --output results/candidate-smoke
      - run: python -m iot_alerts.foundation --policy research --trace-input results/candidate-smoke/workload.csv --queue-capacity 10 --output results/candidate-replay
      - run: cmp results/candidate-smoke/summary.json results/candidate-replay/summary.json
      - run: python -m iot_alerts.study plan --profile smoke --output results/study-smoke
      - run: python -m iot_alerts.study tune --output results/study-smoke
      - run: python -m iot_alerts.study evaluate --output results/study-smoke
      - run: python -m iot_alerts.study verify --output results/study-smoke
