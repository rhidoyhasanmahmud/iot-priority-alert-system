name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q iot_alerts
      - run: python -m iot_alerts.experiment --count 100 --output results/smoke
      - run: python -m iot_alerts.foundation --policy aging --count 100 --queue-capacity 5 --deadlines-ms 100 500 2000 --output results/foundation-smoke
      - run: python -m iot_alerts.pilot --output results/pilot-regression
      - run: cmp evidence/pilot/run_metrics.csv results/pilot-regression/run_metrics.csv
